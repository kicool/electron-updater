<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>learning 桌面端（git-pull 更新原型）</title>
  <style>
    body { font: 14px/1.6 -apple-system, "PingFang SC", sans-serif; margin: 0; padding: 28px; color: #222; background: #fafafa; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .sub { color: #888; margin-bottom: 20px; }
    .card { background: #fff; border: 1px solid #e5e5e5; border-radius: 10px; padding: 16px 18px; margin-bottom: 14px; }
    .row { display: flex; justify-content: space-between; padding: 4px 0; }
    .k { color: #666; } .v { font-weight: 600; }
    .feature { font-size: 28px; font-weight: 800; color: #c0392b; letter-spacing: 2px; }
    button { font: inherit; padding: 9px 16px; border: 0; border-radius: 8px; background: #2d6cdf; color: #fff; cursor: pointer; }
    button:active { transform: translateY(1px); }
    .status { font-weight: 600; }
    .env { background: #eef4ff; border: 1px solid #cfe0fb; border-radius: 10px; padding: 12px 16px; margin-bottom: 16px; }
    .env-title { font-size: 12px; color: #5b7bb5; letter-spacing: 1px; margin-bottom: 6px; }
    .env-row { display: flex; gap: 10px; padding: 2px 0; font-size: 12px; }
    .env-k { color: #5b7bb5; min-width: 118px; flex: none; }
    .env-v { color: #1f3f78; font-weight: 600; word-break: break-all; }
    .env-v.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 500; }
  </style>
</head>
<body>
  <div class="env">
    <div class="env-title">加载环境（验收第一判据：先确认验的是哪棵树）</div>
    <div class="env-row"><span class="env-k">树</span><span class="env-v" id="env-tree">…</span></div>
    <div class="env-row"><span class="env-k">根目录（绝对）</span><span class="env-v mono" id="env-root">…</span></div>
    <div class="env-row"><span class="env-k">入口（相对根）</span><span class="env-v mono" id="env-entry">…</span></div>
    <div class="env-row"><span class="env-k">preload（相对根）</span><span class="env-v mono" id="env-preload">…</span></div>
    <div class="env-row"><span class="env-k">比对分支 / HEAD</span><span class="env-v mono" id="env-ref">…</span></div>
    <div class="env-row"><span class="env-k">autoPull</span><span class="env-v" id="env-autopull">…</span></div>
  </div>

  <h1>learning 桌面端</h1>
  <div class="sub">基于 git-pull 的更新原型 · 渲染层免重启热更</div>

  <div class="card">
    <div class="row"><span class="k">当前版本（git describe）</span><span class="v" id="version">…</span></div>
    <div class="row"><span class="k">功能版本标记</span><span class="feature" id="feature">…</span></div>
    <div class="row"><span class="k">更新状态</span><span class="status" id="status">初始化…</span></div>
  </div>

  <div class="card">
    <button id="check">检查更新</button>
    <button id="apply" style="display:none;background:#c0392b;margin-left:8px;">更新</button>
    <span style="color:#888;margin-left:10px;">点「检查更新」会 fetch 远程；autoPull 开启时自动 pull，关闭时仅提示、点「更新」手动拉取。</span>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
